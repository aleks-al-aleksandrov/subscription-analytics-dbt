version: 2

snapshots:
  - name: subs_snapshot
    description: "SCD Type 2 snapshot of stg_subscriptions tracking plan changes and cancellations via updated_at. Grain: one row per subscription_id and validity period (dbt_valid_from to dbt_valid_to)."
    columns:
      - name: subscription_id
        description: "Natural key of the subscription."
        data_tests:
          - not_null
      - name: customer_id
        description: "Customer who owns the subscription."
        data_tests:
          - not_null
      - name: plan_id
        description: "Plan active during this snapshot validity period."
        data_tests:
          - not_null
      - name: status
        description: "Subscription status during this validity period: active or canceled."
        data_tests:
          - not_null
      - name: is_active
        description: "True when status is active."
      - name: started_date
        description: "Date the subscription originally started."
      - name: canceled_date
        description: "Date the subscription was canceled; null while active."
      - name: updated_at
        description: "Source system timestamp used by the dbt timestamp snapshot strategy."
      - name: dbt_scd_id
        description: "Surrogate key generated by dbt for each snapshot version."
        data_tests:
          - unique
          - not_null
      - name: dbt_updated_at
        description: "Timestamp of the source row when this snapshot version was recorded."
      - name: dbt_valid_from
        description: "Start timestamp of the validity window for this version."
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: "End timestamp of the validity window; null for the currently active version."

