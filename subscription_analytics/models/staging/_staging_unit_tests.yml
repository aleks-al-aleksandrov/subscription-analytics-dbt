version: 2

unit_tests:
  - name: stg_customers_keeps_latest_row_and_cleans_values
    description: "Duplicates collapse to the latest updated_at; email and country are trimmed and case-normalised; empty email becomes null."
    model: stg_customers
    given:
      - input: source('raw', 'customers')
        rows:
          - {customer_id: c1, email: ' Anna@Example.com ', country: ' bg ', segment: B2C, updated_at: '2026-01-01 10:00:00'}
          - {customer_id: c1, email: 'anna@example.com', country: 'BG', segment: B2C, updated_at: '2026-01-05 10:00:00'}
          - {customer_id: c2, email: '', country: 'de', segment: B2B, updated_at: '2026-02-01 09:00:00'}
          - {customer_id: c3, email: 'BOB@EXAMPLE.COM', country: ' NL ', segment: B2C, updated_at: '2026-03-01 09:00:00'}
    expect:
      rows:
        - {customer_id: c1, email: 'anna@example.com', country: 'BG', updated_at: '2026-01-05 10:00:00'}
        - {customer_id: c2, email: null, country: 'DE', updated_at: '2026-02-01 09:00:00'}
        - {customer_id: c3, email: 'bob@example.com', country: 'NL', updated_at: '2026-03-01 09:00:00'}

  - name: stg_payments_dedups_and_sets_flags
    description: "Exact duplicate payments collapse to one row; is_successful follows status; is_late_arrival is true only when the row was created after its payment_date."
    model: stg_payments
    given:
      - input: source('raw', 'payments')
        rows:
          - {payment_id: p1, payment_date: '2026-06-01', amount_eur: 9.0, status: succeeded, created_at: '2026-06-01 09:00:00'}
          - {payment_id: p1, payment_date: '2026-06-01', amount_eur: 9.0, status: succeeded, created_at: '2026-06-01 09:00:00'}
          - {payment_id: p2, payment_date: '2026-06-01', amount_eur: 19.0, status: failed, created_at: '2026-06-05 10:00:00'}
    expect:
      rows:
        - {payment_id: p1, amount_eur: 9.00, is_successful: true, is_late_arrival: false}
        - {payment_id: p2, amount_eur: 19.00, is_successful: false, is_late_arrival: true}
