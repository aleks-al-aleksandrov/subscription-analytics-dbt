name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt-duckdb
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb

      - name: Load initial batch (2026-06-30) and run dbt build
        run: |
          python scripts/generate_data.py --as-of 2026-06-30
          python scripts/load_raw.py
          cd subscription_analytics
          dbt debug --profiles-dir .
          dbt build --profiles-dir .

      - name: Load second batch (2026-09-30) and run incremental + snapshot build
        run: |
          python scripts/generate_data.py --as-of 2026-09-30
          python scripts/load_raw.py
          cd subscription_analytics
          dbt build --profiles-dir .

